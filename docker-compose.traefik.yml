# HTTPS deployment — integrates with an existing Traefik stack
#
# Use this file INSTEAD of docker-compose.yml:
#
#   docker compose -f docker-compose.traefik.yml up -d
#
# Prerequisites:
#   1. cp .env.example .env  and fill in DOMAIN (and optionally TRAEFIK_NETWORK)
#   2. A Traefik instance must already be running on the host and listening on
#      the "websecure" entrypoint with a TLS cert resolver named "le".
#      The app's frontend container joins TRAEFIK_NETWORK so Traefik can reach it.
#
# TRAEFIK_NETWORK defaults to "traefik". Set it in .env if your Traefik stack
# uses a different network name.

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-backend-env: &backend-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
  Jwt__Secret: ${JWT_SECRET}
  Jwt__Issuer: ${JWT_ISSUER}
  Jwt__Audience: ${JWT_AUDIENCE}
  Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"

services:

  postgres:
    image: postgres:18-alpine
    # No user override: postgres image entrypoint must start as root to
    # chmod/chown the data directory, then drops to its internal user automatically.
    environment:
      <<: *postgres-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
    restart: unless-stopped

  frontend:
    build: ./frontend
    user: "101:101"
    depends_on:
      - backend
    networks:
      - default       # internal network: reaches backend by service name
      - traefik-ext   # external Traefik network: Traefik reaches this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.services.app.loadbalancer.server.port=8080"
      # Required when a container is on multiple networks: tells Traefik which
      # network to use when forwarding requests.
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
    restart: unless-stopped

networks:
  default: {}
  traefik-ext:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  pgdata:
