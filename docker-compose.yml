# Profile usage:
#   docker compose --profile dev up    → all services, all debug ports exposed
#   docker compose --profile prd up    → all services, only frontend port exposed
#
# Never run both profiles at the same time.
#
# Before first run:
#   cp .env.example .env   # then edit .env with your values

x-postgres-base: &postgres-base
  image: postgres:18-alpine
  # No user override: the postgres image entrypoint must start as root to
  # chmod/chown the data directory, then it drops to the internal postgres
  # user (UID 70 on Alpine) automatically. Forcing a non-root user here
  # breaks the init sequence.
  environment:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - pgdata:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

x-backend-base: &backend-base
  build: ./backend
  user: "1001:1001"

x-backend-env: &backend-env
  ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
  Jwt__Issuer: ${JWT_ISSUER}
  Jwt__Audience: ${JWT_AUDIENCE}
  Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ASPNETCORE_URLS: "http://+:8080"

x-frontend-base: &frontend-base
  build: ./frontend
  user: "101:101"

services:

  # ── Production profile ─────────────────────────────────────────────────────
  # Ports: only the frontend is reachable from the host.

  postgres:
    <<: *postgres-base
    profiles: ["prd"]

  backend:
    <<: *backend-base
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      Jwt__Secret: ${JWT_SECRET}
      ASPNETCORE_ENVIRONMENT: "Production"
    profiles: ["prd"]

  frontend:
    <<: *frontend-base
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:8080"
    profiles: ["prd"]

  # ── Development profile ────────────────────────────────────────────────────
  # Ports: postgres on POSTGRES_PORT, backend on BACKEND_PORT, frontend on FRONTEND_PORT.
  # Network aliases keep internal service-name references intact so the
  # baked-in nginx proxy (backend:8080) and connection strings (Host=postgres)
  # work without any changes to application config.

  postgres-dev:
    <<: *postgres-base
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      default:
        aliases: [postgres]
    profiles: ["dev"]

  backend-dev:
    <<: *backend-base
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      <<: *backend-env
      Jwt__Secret: ${JWT_SECRET}
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      default:
        aliases: [backend]
    profiles: ["dev"]

  frontend-dev:
    <<: *frontend-base
    depends_on:
      - backend-dev
    ports:
      - "${FRONTEND_PORT}:8080"
    profiles: ["dev"]

volumes:
  pgdata:
